services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.10.0
    container_name: stirling-pdf
    restart: unless-stopped
    volumes:
      - /mnt/data/stirling-pdf/tessdata:/usr/share/tessdata
      - /mnt/data/stirling-pdf/configs:/configs
    environment:
      - SECURITY_ENABLELOGIN=false
      - LANGS=en_GB
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.stirling.middlewares=authentik@file,crowdsec-bouncer@file
      - traefik.http.routers.stirling.rule=Host(`pdf.home.emeffe.com`)
      - traefik.http.routers.stirling.entrypoints=websecure
      - traefik.http.routers.stirling.tls=true
      - traefik.http.routers.stirling.tls.certresolver=cloudflare
      - traefik.http.services.stirling.loadbalancer.server.port=8080
      - traefik.docker.network=traefik_proxy

networks:
  traefik_proxy:
    external: true
